# sqlc configuration matching ./query.sql and the schema in ../queries.go.
#
# This file documents the optional sqlc path from today's lesson. Running
# `sqlc generate` here is not required: the day's code is hand-written on
# purpose so the SQL stays visible.
version: "2"
sql:
  - engine: "sqlite"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "catalogdb"
        out: "catalogdb"
        emit_json_tags: false
        emit_prepared_queries: true
        emit_interface: true
        emit_empty_slices: true
