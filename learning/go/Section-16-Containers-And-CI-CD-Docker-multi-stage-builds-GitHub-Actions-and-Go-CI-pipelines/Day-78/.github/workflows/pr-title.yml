# A second, deliberately tiny workflow.
#
# Two lessons: a workflow does not have to be a pipeline, and a rule enforced
# by CI is a rule nobody has to argue about in review.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commit:
    name: title follows conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check the title
        env:
          # Never interpolate ${{ github.event.* }} directly into a run block:
          # a PR title is attacker-controlled text, and `run: echo ${{ ... }}`
          # is a shell injection. Passing it through env is the safe form.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 /_-]+\))?!?: .+'

          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, for example:"
            echo "::error::  feat(orders): add idempotency keys"
            echo "::error::got: $TITLE"
            exit 1
          fi

          echo "title ok: $TITLE"
