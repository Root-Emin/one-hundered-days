name: ci

# What runs on every pull request. Every step is also a make target, so a
# contributor reproduces a failure locally with the same flags - a pipeline
# that can only be run by pushing is a pipeline people learn to distrust.

on:
  pull_request:
  push:
    branches: [main]

# The default token can write to the repository. This job only reads it.
# Narrowing is free, and it is the difference between a compromised action
# stealing code and rewriting it.
permissions:
  contents: read

# A new push to the same branch cancels the previous run: nobody needs the
# results for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  DAY: Section-20-Capstone-And-Professional-Delivery-Capstone-planning-hardening-deployment-CI-CD-and-final-review/Day-99

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung test runs for six hours and bills for all of them.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: format
        working-directory: learning/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        working-directory: learning/go
        run: go vet ./${{ env.DAY }}/...

      # The race detector, not just the tests: a data race that only appears
      # under load is the most expensive kind of bug to find later.
      - name: test
        working-directory: learning/go
        run: go test -race -count=1 ./${{ env.DAY }}/...

      - name: coverage
        working-directory: learning/go
        run: |
          go test -count=1 -coverprofile=coverage.out ./${{ env.DAY }}/...
          go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.6.2
          working-directory: learning/go
          args: --timeout=5m ./${{ env.DAY }}/...

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # This is the check that would have caught Day 98's five standard-library
      # findings before a human went looking.
      - name: govulncheck
        working-directory: learning/go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./${{ env.DAY }}/...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image is only built once the code is known good. Building it first
    # would waste minutes on every failing pull request.
    needs: [test, lint, vulnerabilities]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pushing only happens on main. A pull request from a fork must never be
      # able to publish an image - that is a supply-chain compromise with a
      # green checkmark.
      - name: log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/linkr
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: learning/go
          file: learning/go/${{ env.DAY }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Built on every run, pushed only from main.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Dockerfile, the compose file and the runbook are assertions in a Go
      # test. They are text, and text can be checked - which is what makes
      # deployment configuration testable without a running daemon.
      - name: deployment artefacts
        working-directory: learning/go
        run: go test -count=1 -tags=deploy ./${{ env.DAY }}/deploy/...
